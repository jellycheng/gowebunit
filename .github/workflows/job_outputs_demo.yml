
name: job_outputs_demo # ci 名称,工作流名称

# 配置触发事件,必须，决定什么时候触发，支持的事件名有push-提交代码，pull_request-pr方式合并代码
on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [dev, staging, main]

jobs:
  myjob1:           # job代号
    name: verify验证暴露变量      # job名,这个job干什么的，可选
    runs-on: ubuntu-latest
    outputs: # 对下游job暴露变量，${{ steps.步骤ID.outputs.步骤变量名 }}
      output1: ${{ steps.step1.outputs.test }}
      output2: ${{ steps.step2.outputs.test }}
    steps:
      - id: step1   # 步骤ID
        run: |
          echo "test=hello你好✅" >> "$GITHUB_OUTPUT" # 暴露变量给job
      - id: step2  # 步骤ID
        run: echo "test=world" >> "$GITHUB_OUTPUT"

  myjob2:
    runs-on: ubuntu-latest
    needs: myjob1
    steps:
      - env: # 定义单个步骤变量，${{ needs.依赖上游job名.outputs.变量名 }}
          OUTPUT1: ${{needs.myjob1.outputs.output1}}
          OUTPUT2: ${{needs.myjob1.outputs.output2}}
        run: |
          echo "使用步骤变量：$OUTPUT1 $OUTPUT2"
